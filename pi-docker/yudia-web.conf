# nginx config for the Yudia website (container "yudia-web" in /docker/docker-compose.yml)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # index.html: always re-check, so a new version of Yudia shows up immediately after an update
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built app files have a content hash in their name → cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
